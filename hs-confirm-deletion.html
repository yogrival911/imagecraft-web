<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Confirm Account Deletion - AI Hairstyle, Haircut & Colour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <div id="status">Verifying link...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      isSignInWithEmailLink,
      signInWithEmailLink,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // TODO: replace with this app's actual Firebase project config
    // (same values you use on the request-deletion page)
    const firebaseConfig = {
        apiKey: "AIzaSyACIlSuZd2ofnwzQhomHdBTkA5FI560eio",
        authDomain: "hair-stylist-5051e.firebaseapp.com",
        projectId: "hair-stylist-5051e",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const statusEl = document.getElementById("status");

    async function run() {
      if (!isSignInWithEmailLink(auth, window.location.href)) {
        statusEl.textContent = "Invalid or expired link.";
        return;
      }

      // Email isn't in the link itself for security — if they opened the
      // link on the same device they requested it from, it's in
      // localStorage already (Firebase SDK stores it). Otherwise ask.
      let email = window.localStorage.getItem("emailForDeletion");
      if (!email) {
        email = window.prompt("Please confirm your email to continue:");
      }

      try {
        const result = await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem("emailForDeletion");

        statusEl.textContent = "Deleting your account...";

        const idToken = await result.user.getIdToken();

        const res = await fetch("https://hairstylistai.fly.dev/auth/account", {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${idToken}`,
          },
        });
        // Debug: log the actual response
          console.log("Response status:", res.status);
          console.log("Response type:", res.headers.get("content-type"));
          const responseText = await res.text();
          console.log("Raw response:", responseText);

          // Now try parsing as JSON
          try {
            const data = JSON.parse(responseText);
            statusEl.textContent = data.success
              ? "Your account and data have been deleted."
              : `Something went wrong: ${data.error}`;
          } catch (parseErr) {
            statusEl.textContent = `Error: Backend returned invalid response. Check browser console.`;
            console.error("Parse error:", parseErr);
          }
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    run();
  </script>
</body>
</html>
