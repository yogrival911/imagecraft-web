<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Delete Your Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h1>Delete Your Account</h1>
  <p>
    Enter the email associated with your account. We'll send you a link
    to confirm deletion. This will permanently delete your profile,
    uploaded photos, generated try-on images, and credit balance.
    This cannot be undone.
  </p>

  <input type="email" id="email" placeholder="you@example.com" required />
  <button id="submitBtn">Send deletion link</button>
  <p id="status"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      sendSignInLinkToEmail,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAX4fQACNJc324HCialHjqkAxBR3yToUII",
      authDomain: "futuraai-8676d.firebaseapp.com",
      projectId: "futuraai-8676d",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const statusEl = document.getElementById("status");

      if (!email) return;

      statusEl.textContent = "Sending...";

      try {
        // Call your backend, which generates the link via Admin SDK
        // and emails it (keeps the actual email link generation server-side
        // so it's tied to a real user check).
        const res = await fetch("https://YOUR_API_DOMAIN/auth/request-deletion", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        // Store email locally so confirm-deletion.html can read it if
        // opened on the same device/browser.
        window.localStorage.setItem("emailForDeletion", email);

        statusEl.textContent = data.success
          ? "Check your email for a confirmation link."
          : `Error: ${data.error}`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    });
  </script>
</body>
</html>
